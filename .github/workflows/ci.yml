name: CI

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee ci-artifacts/01-install.log
          cp package-lock.json ci-artifacts/package-lock.json

      - name: Translation coverage
        run: |
          set -o pipefail
          npm run check:i18n 2>&1 | tee ci-artifacts/02-i18n.log

      - name: Type check
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-artifacts/03-typecheck.log

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ci-artifacts/04-lint.log

      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-artifacts/05-build.log

      - name: Rendered checks and screenshots
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          (npm start -- -p 3000 > ci-artifacts/06-server.log 2>&1 &)
          npx --yes wait-on@8 http://localhost:3000/fr -t 60000
          node scripts/ci-shots.mjs 2>&1 | tee ci-artifacts/07-rendered.log

      - name: Publish results to the ci-artifacts branch
        if: always()
        run: |
          echo "commit=${GITHUB_SHA}" > ci-artifacts/00-commit.txt
          echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> ci-artifacts/00-commit.txt
          echo "outcome=${{ job.status }}" >> ci-artifacts/00-commit.txt
          cd ci-artifacts
          git init -q
          git config user.name "lek-ci"
          git config user.email "lek-ci@users.noreply.github.com"
          RESULTS=ci-artifacts; [ "${GITHUB_REF_NAME}" = "staging" ] && RESULTS=ci-artifacts-staging
          git checkout -q -b "$RESULTS"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$RESULTS"
